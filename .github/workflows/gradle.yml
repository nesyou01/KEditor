name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure NDK Toolchain
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          
          echo "ANDROID_NDK_HOME=$NDK"
          echo "TOOLCHAIN=$TOOLCHAIN"

      - name: Verify NDK Toolchain
        run: |
          "$TOOLCHAIN/bin/clang" --version
          "$TOOLCHAIN/bin/llvm-ar" --version

      - name: Build with Gradle
        uses: gradle/gradle-build-action@ce999babab2de1c4b649dc15f0ee67e6246c994f
        with:
          arguments: ${{ matrix.target }}
